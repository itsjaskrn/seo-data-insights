openapi: 3.1.0
info:
  title: Data Insights Action
  version: "1.1.0"
  description: Read Search Console properties and performance data for the connected Google account.
servers:
  - url: https://seo-data-insights.vercel.app
paths:
  /api/gsc-sites:
    get:
      operationId: listGSCProperties
      summary: List Search Console properties accessible to the connected user
      security:
        - google_oauth:
            - https://www.googleapis.com/auth/webmasters.readonly
      responses:
        "200":
          description: Accessible properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  siteEntry:
                    type: array
                    items:
                      type: object
                      properties:
                        siteUrl:
                          type: string
                        permissionLevel:
                          type: string
        "401":
          description: Google sign-in required or token expired
  /api/gsc-query:
    post:
      operationId: runGSCQuery
      summary: Query performance for a selected Search Console property
      security:
        - google_oauth:
            - https://www.googleapis.com/auth/webmasters.readonly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteInput, startDate, endDate, dimensions]
              properties:
                siteInput:
                  type: string
                  description: Exact siteUrl from listGSCProperties, including URL protocol or sc-domain prefix
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                dimensions:
                  type: array
                  items:
                    type: string
                    enum: [date, query, page, country, device, searchAppearance]
                rowLimit:
                  type: integer
                  minimum: 1
                  maximum: 25000
                dataState:
                  type: string
                  enum: [final, all, hourly_all]
      responses:
        "200":
          description: Search Analytics API response
        "401":
          description: Google sign-in required or token expired
components:
  securitySchemes:
    google_oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/webmasters.readonly: Read-only Search Console access
